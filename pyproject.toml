[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crashjarvis"
version = "0.1.0"
description = "A local voice AI agent for Windows."
requires-python = ">=3.13,<3.14"
dependencies = [
    "faster-whisper>=1.2,<2",
    "numpy>=2.1,<3",
    "onnxruntime>=1.22,<2",
    "sounddevice>=0.5,<0.6",
    "soxr>=1.1,<2",
    "openwakeword>=0.6,<0.7",
    "ollama>=0.6,<0.7",
    "pywinauto>=0.6.9,<0.7",
    "pywin32>=312,<313",
    "mss==10.2.0",
    "kokoro-onnx>=0.5,<0.6",
    "PySide6>=6.11.1,<6.12",

    "nvidia-cublas-cu12>=12,<13; platform_system == 'Windows'",
    "nvidia-cudnn-cu12>=9,<10; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "types-pywin32>=312,<313",
]